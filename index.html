<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virus and Host Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header & Controls -->
        <header>
            <h1 id="title" data-en="Virus-Host Index" data-as="ভাইৰাছ-হোষ্ট সূচী">Virus-Host Index</h1>
            
            <div class="controls">
                <!-- Language Toggle Button -->
                <button id="lang-btn" class="lang-btn">অসমীয়া</button>

                <!-- Theme Switcher -->
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </header>

        <!-- Dynamic Data Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th data-en="Virus" data-as="ভাইৰাছ">Virus</th>
                        <th data-en="Host" data-as="হোষ্ট (আশ্রয়দাতা)">Host</th>
                        <!-- Extra <th> tags added here will auto-style -->
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Mogibara</td>
                        <td data-en="Vikas" data-as="বিকাশ">Vikas</td>
                    </tr>
                    <tr>
                        <td data-en="Japanese Encephalitis" data-as="জাপানীজ এনকেফেলাইটিছ">Japanese Encephalitis</td>
                        <td data-en="Pigs, Birds, and Humans" data-as="গাহৰি, চৰাই আৰু মানুহ">Pigs, Birds, and Humans</td>
                    </tr>
                    <!-- You can add extra <tr> and <td> tags here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts for Theme and Language Switching -->
    <script>
        // --- Dark/Light Mode Logic ---
        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        toggleSwitch.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }    
        });

        // --- English/Assamese Language Logic ---
        const langBtn = document.getElementById('lang-btn');
        let currentLang = 'en'; // default language

        langBtn.addEventListener('click', () => {
            // Toggle language state
            currentLang = currentLang === 'en' ? 'as' : 'en';
            
            // Update button text
            langBtn.textContent = currentLang === 'en' ? 'অসমীয়া' : 'English';
            
            // Find all elements that have translations available
            const translatableElements = document.querySelectorAll('[data-en][data-as]');
            
            translatableElements.forEach(el => {
                if (currentLang === 'as') {
                    el.textContent = el.getAttribute('data-as');
                } else {
                    el.textContent = el.getAttribute('data-en');
                }
            });
        });
    </script>
</body>
    
</html>
